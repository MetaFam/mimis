services:
  janusgraph:
    container_name: authed-janusgraph
    build:
      context: config/janusgraph/
      dockerfile: Dockerfile
    ports:
      - "8182:8182"
    volumes:
      - ./config/janusgraph/server.yaml:/opt/janusgraph/conf/janusgraph-server.yaml:ro
      - ./config/janusgraph/mimis.properties:/etc/opt/janusgraph/mimis.properties:ro
      - ./config/janusgraph/credentials.properties:/etc/opt/janusgraph/credentials.properties:ro
      - janusgraph-data:/var/lib/janusgraph
    environment:
      - JANUS_PROPS_TEMPLATE=berkeleyje-lucene
      - gremlinserver.graphs.graph=/etc/opt/janusgraph/mimis.properties
      - janusgraph.graph.replace-instance-if-exists=true
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 8182"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  openvscode:
    container_name: mimis-editor
    image: gitpod/openvscode-server:latest
    ports:
      - "33333:3000"
    # The mimis-fs extension must be built first: `pnpm run editor:build`
    command: ["--without-connection-token"]
    volumes:
      - ./editor:/home/.openvscode-server/extensions/mimis.mimis-fs-0.1.0:ro
      - openvscode-data:/home/workspace

volumes:
  janusgraph-data:
  openvscode-data:
